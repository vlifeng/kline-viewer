name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /kline-viewer/
          # repo variable VITE_API_BASE overrides; fallback is the current quick tunnel
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://ballot-macintosh-basin-won.trycloudflare.com' }}
        run: npm run build

      - name: Deploy to gh-pages
        working-directory: frontend/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "Deploy kline viewer to GitHub Pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
